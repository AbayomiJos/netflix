name: netflix-ci

on:
  push:
    branches:
      - main  # Adjust if your main branch has a different name

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: devabayomi/netflix:latest
          outputs: type=image,push=true

      # Capture the short Git SHA as the new image tag (common practice)
      - name: Set image tag output
        run: echo "image_tag=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_OUTPUT
        id: tag

  update-helm-chart:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # Change to your branch name if different
    steps:
      - name: Checkout Helm Charts repository
        uses: actions/checkout@v4
        with:
          repository: https://github.com/AbayomiJos/helmchart  # Replace with your actual Helm repo (e.g., devabayomi/helm-charts)
          ref: main                           # Replace with the branch you update (e.g., main or dev)
          token: ${{ secrets.HELM_REPO_PAT }} # Create a PAT with repo access and add as secret

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O yq
          chmod +x yq
          sudo mv yq /usr/local/bin/

      - name: Update values.yaml with new image tag
        env:
          NEW_TAG: ${{ needs.docker.outputs.image_tag }}  # Uses short SHA from previous job
        run: |
          # Adjust the path to your actual values.yaml
          yq e '.image.tag = "'$NEW_TAG'"' -i values.yaml
          # Or if nested: yq e '.image.version = "'$NEW_TAG'"' -i path/to/values.yaml

          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -m "Update image tag to ${{ needs.docker.outputs.image_tag }}"
          git push
